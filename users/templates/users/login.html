{% extends "base.html" %} {% load crispy_forms_tags %} {% block content %}
<h1 class="text-2xl font-bold">Welcome back!</h1>
<p class="text-sm text-gray-500">Enter your email and password to login.</p>
<form action="{% url 'login' %}" class="mt-4" method="post">
  {% csrf_token %} {{form|crispy}}
  <button
    class="inline-flex items-center gap-2 rounded-sm border border-indigo-600 bg-indigo-600 px-8 py-3 text-white hover:bg-transparent hover:text-indigo-600"
    type="submit"
  >
    <span class="text-sm font-medium">Login</span>
    <svg
      class="size-5 rtl:rotate-180"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M17 8l4 4m0 0l-4 4m4-4H3"
      ></path>
    </svg>
  </button>
</form>
{% endblock %}
